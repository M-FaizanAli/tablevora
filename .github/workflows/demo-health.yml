name: Demo health check

on:
  schedule:
    # Avoid the busiest minute at the start of each hour. GitHub may delay runs.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the public demo API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 1 --retry-delay 5 --retry-max-time 185 \
            https://tablevora-api.onrender.com/api/health \
            --output /tmp/demo-health.json
          jq -e '.status == "ok"' /tmp/demo-health.json
          echo 'Tablevora demo API is healthy.' >> "$GITHUB_STEP_SUMMARY"
