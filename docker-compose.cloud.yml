services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tablevora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tablevora
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablevora"]
      interval: 5s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENABLE_SWAGGER: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql://tablevora:${POSTGRES_PASSWORD}@postgres:5432/tablevora
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:1995}
      PORT: "4000"
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1995}:3000"
    depends_on:
      - backend
volumes:
  database:
  uploads:
