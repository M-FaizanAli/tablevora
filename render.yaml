# Dedicated sample-data demo. Use a durable paid database/volume for clients.
databases:
  - name: tablevora-demo-db
    plan: free
    databaseName: tablevora
    user: tablevora
services:
  - type: web
    name: tablevora-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tablevora-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/tablevora-uploads
