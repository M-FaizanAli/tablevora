# Free demo API. Supply an external PostgreSQL URL (for example Neon Free).
# No expiring Render database is created by this blueprint.
services:
  - type: web
    name: tablevora-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/tablevora-uploads
